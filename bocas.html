<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traçados de Caldeiraria</title>
<style>
:root{--bg:#f5f5f2;--fg:#1d1d1b;--card:#fff;--line:#c9c9c2;--acc:#b5540a;--mut:#666}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ececea;--card:#22221f;--line:#4a4a45;--acc:#e0813a;--mut:#9a9a92}}
:root[data-theme="dark"]{--bg:#171716;--fg:#ececea;--card:#22221f;--line:#4a4a45;--acc:#e0813a;--mut:#9a9a92}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
header{padding:16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--line)}
main{padding:0 16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select{width:100%;padding:10px;margin-top:4px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:disabled{opacity:.45}
.go{width:100%;margin-top:14px;padding:12px;font-size:16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:600}
.res{margin-top:14px;font-size:15px;line-height:1.6}
.res b{color:var(--acc)}
.res p{margin:6px 0}
.viz{margin-top:12px;background:var(--bg);border-radius:8px;padding:6px}
.viz svg{width:100%;height:auto;display:block}
.err{color:#c0392b;font-size:14px}
.note{font-size:12px;color:var(--mut);margin-top:10px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5540a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header><a href="index.html" style="color:var(--acc);text-decoration:none">&larr; Menu</a> &nbsp; Bocas de lobo</header>
<main>
<div class="card">
  <label>Tipo de boca
    <select id="bTipo" onchange="atualizaCampos()">
      <option value="cen">Centrada (ramal perpendicular, eixos cruzados)</option>
      <option value="exc">Excêntrica (ramal deslocado do eixo)</option>
      <option value="inc">Inclinada (ramal com inclinação)</option>
    </select></label>
  <label>Diâmetro do tubo principal D (mm)<input id="D" type="number" value="300"></label>
  <label>Diâmetro do ramal d (mm)<input id="d" type="number" value="150"></label>
  <label>O diâmetro informado é<select id="mTipo"><option value="ext">externo</option><option value="int">interno</option><option value="med">linha média</option></select></label>
  <label>Espessura t (mm)<input id="t" type="number" value="6"></label>
  <label>Comprimento do ramal H, do eixo até o topo (mm)<input id="H" type="number" value="300"></label>
  <label>Comprimento do tubo principal Lm (mm)<input id="Lm" type="number" value="600"></label>
  <label>Excentricidade e (mm, só para excêntrica)<input id="e" type="number" value="60"></label>
  <label>Inclinação do ramal γ (°, só para inclinada)<input id="g" type="number" value="30"></label>
  <button class="go" onclick="calcBoca()">Calcular</button>
  <div id="bOut" class="res"></div>
  <button class="go" onclick="ver3d()">Ver objeto em 3D</button>
  <div id="bView" class="viz" style="height:auto;padding:0;overflow:hidden"></div>
  <p class="note">Arraste na tela para girar a peça.</p>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const v = id => parseFloat($(id).value);
const err = m => `<span class="err">${m}</span>`;
const RAD = Math.PI / 180;
const CORES = ['#b5540a', '#2a7fbf'];
const VIEWS = {};
const LBL = 'font-size:12px;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;';
const tri = (T, a, b, c) => { T.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]); };

// Converte o diâmetro informado para a linha neutra (média) da chapa
function dmed(D, t, tipo){
  if (tipo === 'int') return D + t;
  if (tipo === 'med') return D;
  return D - t;
}

// Ajusta pontos a uma área de desenho (SVG), invertendo o eixo y
function fit(xs, ys, W, H){
  const minx = Math.min(...xs), maxx = Math.max(...xs);
  const miny = Math.min(...ys), maxy = Math.max(...ys);
  const s = Math.min((W - 40) / ((maxx - minx) || 1), (H - 40) / ((maxy - miny) || 1));
  return { f: (x, y) => [20 + (x - minx) * s, H - 20 - (y - miny) * s] };
}

// Habilita só os campos usados em cada tipo de boca
function atualizaCampos(){
  const b = $('bTipo').value;
  $('e').disabled = b !== 'exc';
  $('g').disabled = b !== 'inc';
}

// Geometria (linha neutra). Eixo do tubo principal: z. Ramal sai do ponto (0, e, 0)
// na direção u = (cos g, 0, sen g). f é o ângulo em torno do eixo do ramal.
function Qf(p, s, f){
  const cg = Math.cos(p.g), sg = Math.sin(p.g);
  return [s*cg - p.r*Math.sin(f)*sg, p.e + p.r*Math.cos(f), s*sg + p.r*Math.sin(f)*cg];
}
// Distância ao longo do ramal até a parede do tubo principal (lado de fora)
function sCut(p, f){
  const W = Math.sqrt(Math.max(0, p.R*p.R - (p.e + p.r*Math.cos(f))**2));
  return (p.r*Math.sin(f)*Math.sin(p.g) + W) / Math.cos(p.g);
}

function getP(out){
  const mt = $('mTipo').value, t = v('t');
  const p = {
    R: dmed(v('D'), t, mt) / 2, r: dmed(v('d'), t, mt) / 2,
    H: v('H'), Lm: v('Lm'), e: 0, g: 0, bt: $('bTipo').value
  };
  if (p.bt === 'exc') p.e = v('e') || 0;
  if (p.bt === 'inc') p.g = (v('g') || 0) * RAD;
  if (!(p.r > 0 && p.R > p.r && Math.abs(p.e) + p.r <= p.R && p.H > 0 && p.Lm > 0 && p.g >= 0 && p.g <= 75 * RAD)){
    out.innerHTML = err('Confira: D > d > 0, |e| + d/2 ≤ D/2, H > 0, Lm > 0 e inclinação entre 0° e 75°.');
    return null;
  }
  let smax = -Infinity, zmax = 0;
  for (let i = 0; i <= 360; i++){
    const f = 2*Math.PI*i/360, s = sCut(p, f);
    smax = Math.max(smax, s);
    zmax = Math.max(zmax, Math.abs(Qf(p, s, f)[2]));
  }
  if (p.H <= smax){ out.innerHTML = err('H curto: aumente H para o ramal atravessar a parede do tubo principal.'); return null; }
  if (p.Lm / 2 <= zmax){ out.innerHTML = err('Lm curto: aumente o comprimento do tubo principal.'); return null; }
  return p;
}

// Planificação do ramal: largura = πd, topo reto em cima, corte embaixo
function devRamal(p, N){
  const L = 2*Math.PI*p.r, pts = [];
  for (let i = 0; i <= N; i++){
    const f = 2*Math.PI*i/N;
    pts.push([p.r*f, -(p.H - sCut(p, f))]);
  }
  const g = fit([0, L, ...pts.map(q => q[0])], [0, 0, ...pts.map(q => q[1])], 560, 200);
  const P = [[0, 0], [L, 0], ...pts.slice().reverse()]
    .map(q => g.f(q[0], q[1]).map(c => c.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 560 240">
    <polygon points="${P}" style="fill:var(--card);stroke:var(--acc);stroke-width:2"/>
    <text x="20" y="16" style="${LBL}">Topo do ramal (borda reta)</text>
    <text x="280" y="236" text-anchor="middle" style="${LBL}">Largura = πd = ${L.toFixed(1)} mm</text>
  </svg>`;
}

// Furo no tubo principal, desenvolvido (θ = 0 no centro, linha tracejada)
function devTubo(p, N, Lm){
  const L = 2*Math.PI*p.R, pts = [], th = [];
  for (let i = 0; i <= N; i++){
    const f = 2*Math.PI*i/N, q = Qf(p, sCut(p, f), f);
    const a = Math.atan2(q[1], q[0]);
    th.push(a);
    pts.push([p.R*(a + Math.PI), q[2]]);
  }
  const g = fit([0, L, ...pts.map(q => q[0])], [-Lm/2, Lm/2, ...pts.map(q => q[1])], 560, 300);
  const rect = [[0, -Lm/2], [L, -Lm/2], [L, Lm/2], [0, Lm/2]]
    .map(q => g.f(q[0], q[1]).map(c => c.toFixed(1)).join(',')).join(' ');
  const hole = pts.map(q => g.f(q[0], q[1]).map(c => c.toFixed(1)).join(',')).join(' ');
  const a0 = g.f(L/2, -Lm/2), a1 = g.f(L/2, Lm/2);
  return {
    larg: p.R * (Math.max(...th) - Math.min(...th)),
    svg: `<svg viewBox="0 0 560 320">
      <polygon points="${rect}" style="fill:var(--card);stroke:var(--acc);stroke-width:2"/>
      <polygon points="${hole}" style="fill:var(--bg);stroke:var(--acc);stroke-width:1.5"/>
      <line x1="${a0[0].toFixed(1)}" y1="${a0[1].toFixed(1)}" x2="${a1[0].toFixed(1)}" y2="${a1[1].toFixed(1)}" style="stroke:var(--fg);stroke-width:1;stroke-dasharray:4 4"/>
      <text x="20" y="16" style="${LBL}">Tubo principal desenvolvido</text>
      <text x="280" y="316" text-anchor="middle" style="${LBL}">Circunferência = 2πR = ${L.toFixed(1)} mm · comprimento = ${Lm.toFixed(1)} mm</text>
    </svg>`
  };
}

function calcBoca(){
  const out = $('bOut'), p = getP(out);
  if (!p) return;
  const N = 72, ss = [];
  for (let i = 0; i < N; i++) ss.push(sCut(p, 2*Math.PI*i/N));
  const hmax = p.H - Math.min(...ss), hmin = p.H - Math.max(...ss);
  const tub = devTubo(p, N, p.Lm);
  out.innerHTML = `
    <p>Linha neutra: D = <b>${(2*p.R).toFixed(1)} mm</b> · d = <b>${(2*p.r).toFixed(1)} mm</b></p>
    <p>Largura da planificação do ramal (πd): <b>${(2*Math.PI*p.r).toFixed(1)} mm</b></p>
    <p>Altura do corte no ramal, medida do topo: de <b>${hmin.toFixed(1)} mm</b> a <b>${hmax.toFixed(1)} mm</b></p>
    <p>Largura do furo no tubo principal (desenvolvida): <b>${tub.larg.toFixed(1)} mm</b></p>
    <div class="viz">${devRamal(p, N)}</div>
    <div class="viz">${tub.svg}</div>
    <p class="note">Ramal: trace a planificação com a borda reta no topo e marque a altura de cada ponto do corte. Tubo principal: marque o furo a partir da linha de centro tracejada. Valide com gabarito antes de cortar.</p>`;
}

// Modelo 3D aberto (sem tampas): tubo principal com furo + ramal até o corte
function model3d(p, Lm){
  const R = p.R, r = p.r, H = p.H, e = p.e;
  const u = [Math.cos(p.g), 0, Math.sin(p.g)];
  // Ponto da parede principal que está dentro do ramal (não é gerado: é o furo)
  const noFuro = q => {
    const w = [q[0], q[1] - e, q[2]];
    const sp = w[0]*u[0] + w[1]*u[1] + w[2]*u[2];
    if (sp <= 0 || sp >= H) return false;
    return Math.hypot(w[0] - sp*u[0], w[1] - sp*u[1], w[2] - sp*u[2]) < r;
  };
  const Mp = (th, z) => [R*Math.cos(th), R*Math.sin(th), z];
  const T1 = [], T2 = [], nM = 96, nZ = 40;
  for (let i = 0; i < nM; i++){
    const a0 = 2*Math.PI*i/nM, a1 = 2*Math.PI*(i+1)/nM;
    for (let j = 0; j < nZ; j++){
      const z0 = -Lm/2 + Lm*j/nZ, z1 = -Lm/2 + Lm*(j+1)/nZ;
      if (noFuro(Mp((a0+a1)/2, (z0+z1)/2))) continue;
      const A = Mp(a0, z0), B = Mp(a1, z0), C = Mp(a1, z1), D = Mp(a0, z1);
      tri(T1, A, B, C); tri(T1, A, C, D);
    }
  }
  for (let k = 0; k < nM; k++){
    const f0 = 2*Math.PI*k/nM, f1 = 2*Math.PI*(k+1)/nM;
    const c0 = Qf(p, sCut(p, f0), f0), c1 = Qf(p, sCut(p, f1), f1);
    const t0 = Qf(p, H, f0), t1 = Qf(p, H, f1);
    tri(T2, c0, c1, t1); tri(T2, c0, t1, t0);
  }
  return [{nome: 'Tubo principal (lateral)', T: T1}, {nome: 'Ramal (lateral)', T: T2}];
}

function mount3d(divId, G){
  const div = $(divId);
  if (typeof THREE === 'undefined'){ div.innerHTML = err('Biblioteca 3D indisponível neste ambiente.'); return; }
  if (VIEWS[divId]){ VIEWS[divId].alive = false; VIEWS[divId].r.forceContextLoss(); }
  const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  G.forEach(g => { for (let i = 0; i < g.T.length; i++){ const k = i % 3; mn[k] = Math.min(mn[k], g.T[i]); mx[k] = Math.max(mx[k], g.T[i]); } });
  const c = mn.map((m, k) => (m + mx[k]) / 2);
  const size = Math.max(...mx.map((M, k) => M - mn[k])) || 1;
  const w = div.clientWidth || 340, h = 260;
  const r = new THREE.WebGLRenderer({antialias: true, alpha: true});
  r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  r.setSize(w, h);
  const el = r.domElement;
  el.style.cssText = `width:100%;height:${h}px;display:block;touch-action:none`;
  div.innerHTML = '';
  div.style.height = 'auto';
  div.appendChild(el);
  const leg = document.createElement('div');
  leg.style.cssText = 'padding:8px 10px;font-size:13px;line-height:1.9;color:var(--fg)';
  leg.innerHTML = G.map((g, i) => `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${CORES[i]};margin-right:6px;vertical-align:middle"></span>${g.nome}`).join('<br>');
  div.appendChild(leg);

  const sc = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(40, w/h, 0.1, size*100);
  cam.up.set(0, 0, 1);
  cam.position.set(0, -size*1.8, size*0.9);
  cam.lookAt(0, 0, 0);
  sc.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(1, -1.5, 2);
  sc.add(dl);
  const grp = new THREE.Group();
  sc.add(grp);
  G.forEach((g, i) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.T, 3));
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: CORES[i], metalness: 0.2, roughness: 0.45, side: THREE.DoubleSide, flatShading: true
    }));
    m.position.set(-c[0], -c[1], -c[2]);
    grp.add(m);
  });

  let drag = false, lx = 0, ly = 0;
  el.onpointerdown = ev => { drag = true; lx = ev.clientX; ly = ev.clientY; el.setPointerCapture(ev.pointerId); };
  el.onpointermove = ev => {
    if (!drag) return;
    grp.rotation.z += (ev.clientX - lx) * 0.01;
    grp.rotation.x = Math.max(-1.5, Math.min(1.5, grp.rotation.x + (ev.clientY - ly) * 0.01));
    lx = ev.clientX; ly = ev.clientY;
  };
  el.onpointerup = el.onpointercancel = () => { drag = false; };

  const st = {alive: true, r};
  VIEWS[divId] = st;
  const loop = () => { if (!st.alive) return; requestAnimationFrame(loop); r.render(sc, cam); };
  loop();
}

function ver3d(){
  const out = $('bOut'), p = getP(out);
  if (!p) return;
  mount3d('bView', model3d(p, p.Lm));
}

atualizaCampos();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
